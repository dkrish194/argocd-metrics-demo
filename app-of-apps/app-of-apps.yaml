apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/dkrish194/argocd-metrics-demo.git
      targetRevision: main
      path: metrics-demo/argo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
