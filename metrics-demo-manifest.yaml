---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-demo
  namespace: metrics-demo
  labels:
    project: metrics-demo
    teir: backend
    component: metrics-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      project: metrics-demo
      teir: backend
      component: metrics-demo
  template:
    metadata:
      name: metrics-demo
      labels:
        project: metrics-demo
        teir: backend
        component: metrics-demo
    spec:
      containers:
        - name: metrics-demo
          image: dkrish194/metrics-demo:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "200m"
              memory: "500Mi"
            limits:
              cpu: "200m"
              memory: "500Mi"
          # readinessProbe:
          #   tcpSocket:
          #     port: 8080
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          #   failureThreshold: 5
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8080
          #   periodSeconds: 10
          #   failureThreshold: 10
          # envFrom:
          #   - configMapRef:
          #       name: metrics-demo


---
apiVersion: v1
kind: Service
metadata:
  name: metrics-demo
  namespace: metrics-demo
  labels:
    project: metrics-demo
    teir: backend
    component: metrics-demo
spec:
  selector:
    project: metrics-demo
    teir: backend
    component: metrics-demo
  ports:
    - port: 8080
      targetPort: 5000
      protocol: TCP






